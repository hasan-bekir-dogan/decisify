spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: decision-service
              uri: ${DECISION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/decisions/**
              filters:
                - StripPrefix=1

            - id: document-service
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/documents/**
              filters:
                - StripPrefix=1

            - id: genai-service
              uri: ${GENAI_SERVICE_URL:http://localhost:8001}
              predicates:
                - Path=/api/ai/**
              filters:
                - StripPrefix=1

            - id: simulation-service
              uri: ${SIMULATION_SERVICE_URL:http://localhost:8002}
              predicates:
                - Path=/api/simulations/**
              filters:
                - StripPrefix=1
                
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_ORIGIN:http://localhost:3000}
                  - http://localhost:5173
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                exposedHeaders:
                  - Location
                allowCredentials: true
                maxAge: 3600
security:
  jwt:
    secret: ${JWT_SECRET:12345678901234567890123456789012}
    
server:
  port: 8088