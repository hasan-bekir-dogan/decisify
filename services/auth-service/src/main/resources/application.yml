spring:
  application:
    name: auth-service

  data-source:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USERNAME:decisify}
    password: ${AUTH_DB_PASSWORD:decisify}
    driver-class-name: org.postgresql.Driver
  
  jpa: 
    hibernate: 
      ddl-auto: validate

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000